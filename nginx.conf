# Production Nginx Configuration Template
# Place this configuration in /etc/nginx/sites-available/collegeconnect on your VPS host.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificates are installed)
    # return 301 https://$host$request_uri;

    # ── Frontend Static Files Routing ────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000; # Address where frontend server is running (e.g. Docker container or preview)
        # Or if serving built static files directly via Nginx:
        # root /var/www/collegeconnect/frontend/dist;
        # index index.html;
        # try_files $uri $uri/ /index.html;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend API Reverse Proxy ───────────────────────────
    # Map all API route endpoints to the Node.js backend running on port 5000
    location ~ ^/(auth|alumni|posts|feeds|events|jobs-api|donations|api/user|news|connections|chat|admin) {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Max request size (e.g. for image uploads)
        client_max_body_size 10M;
    }

    # Serve uploads directly via Nginx (bypasses Express for static speed)
    location /uploads/ {
        alias /var/www/collegeconnect/backend/src/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Socket.io WebSocket Reverse Proxy ────────────────────
    # Crucial configurations for persistent WebSocket connections
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering and set timeouts for WebSocket connections
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

