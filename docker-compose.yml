version: '3.8'

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: college-connect-db
    restart: always
    environment:
      MYSQL_DATABASE: CollegeConnect
      MYSQL_ROOT_PASSWORD: safe_root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # To initialize database on first run, place database.sql in a dynamic init folder
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # 2. Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college-connect-backend
    restart: always
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=safe_root_password_change_me
      - DB_NAME=CollegeConnect
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_USER=your-email@gmail.com
      # - SMTP_PASS=your-email-app-password
    ports:
      - "5000:5000"
    volumes:
      # Persistent volume mount for uploads
      - uploads_data:/app/src/uploads
    depends_on:
      - db
    networks:
      - app-network

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass backend container address or public URL as API base
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: college-connect-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
